plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.qtxsy.bot"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId "com.qtxsy.bot" // إذا عندكم applicationId موجود من قبل، خلوه هو وما تبدلوه
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug // مؤقت للتجربة بس — لازم يتبدل بتوقيع حقيقي قبل أي نشر
        }
    }
}

flutter { source "../.." }
